services:

  mongodb:
    image: mongo:8.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - bigdata_network
    entrypoint: >
      bash -c "docker-entrypoint.sh mongod &
               sleep 5 &&
               mongosh amazon_sentiment --eval 'db.streaming_predictions.drop()' &&
               wait"
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - bigdata_network

  producer:
    build: ./producer
    container_name: producer
    depends_on:
      - kafka
    volumes:
      - /home/dell/data:/data
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - bigdata_network
    restart: on-failure

  spark_streaming:
    build: ./spark_streaming
    container_name: spark_streaming
    depends_on:
      - kafka
      - mongodb
    volumes:
      - /home/dell/data:/data
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGO_URI: mongodb://mongodb:27017/
    networks:
      - bigdata_network
    restart: on-failure

  dashboard:
    build: ./dashboard
    container_name: dashboard
    ports:
      - "8501:8501"
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://mongodb:27017/
    networks:
      - bigdata_network

  dashboard_offline:
    build: ./dashboard_offline
    container_name: dashboard_offline
    ports:
      - "8502:8502"
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://mongodb:27017/
    networks:
      - bigdata_network
  api:
    build: ./api
    container_name: api
    ports:
      - "8000:8000"
    networks:
      - bigdata_network

networks:
  bigdata_network:
    driver: bridge

volumes:
  mongodb_data:
